services:
  dnsmasq:
    image: alpine:3.20
    restart: unless-stopped
    command: sh -c "apk add --no-cache dnsmasq && exec dnsmasq -k -C /etc/dnsmasq.conf --log-facility=-"
    volumes:
      - ./dnsmasq.conf:/etc/dnsmasq.conf:ro
    ports:
      # Publié sur l'IP du conteneur seulement, pour ne pas entrer en conflit
      # avec le DNS interne d'Ubuntu (127.0.0.53:53). Adapte l'IP à ton réseau.
      - "192.168.1.143:53:53/udp"
      - "192.168.1.143:53:53/tcp"
    mem_limit: 32m
