map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

ssl_certificate     /etc/nginx/certs/lab.crt;
ssl_certificate_key /etc/nginx/certs/lab.key;
ssl_protocols       TLSv1.2 TLSv1.3;
client_max_body_size 500m;

# HTTP -> HTTPS
server {
    listen 80 default_server;
    return 301 https://$host$request_uri;
}

# ---------- Login (Authelia) ----------
server {
    listen 443 ssl;
    server_name auth.alltools.lan;
    location / {
        proxy_pass http://authelia:9091;
        include /etc/nginx/snippets/proxy-common.conf;
    }
}

# ---------- Portail (page d'accueil, après login) ----------
server {
    listen 443 ssl;
    server_name alltools.lan;
    include /etc/nginx/snippets/authelia-location.conf;

    # Données de statut pour la page (protégées par le login)
    location = /api/status {
        include /etc/nginx/snippets/authelia-protect.conf;
        set $up http://status:8080;
        resolver 127.0.0.11 valid=10s;
        proxy_pass $up/status.json;
    }

    location / {
        include /etc/nginx/snippets/authelia-protect.conf;
        root /usr/share/nginx/portal;
        index index.html;
    }
}

# ---------- Outils ----------
