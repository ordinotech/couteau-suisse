# Les secrets sont passés par le fichier .env (variables AUTHELIA_*)
server:
  address: 'tcp://0.0.0.0:9091'

log:
  level: 'info'

authentication_backend:
  file:
    path: '/config/users_database.yml'

access_control:
  default_policy: 'one_factor'

session:
  cookies:
    - domain: 'alltools.lan'
      authelia_url: 'https://auth.alltools.lan'
      default_redirection_url: 'https://alltools.lan'
      expiration: '12h'
      inactivity: '2h'

regulation:
  max_retries: 5
  find_time: '2m'
  ban_time: '10m'

storage:
  local:
    path: '/config/db.sqlite3'

notifier:
  filesystem:
    filename: '/config/notification.txt'
